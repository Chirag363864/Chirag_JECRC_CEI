# configs/mini.yaml
# ─────────────────────────────────────────────────────────────────────────────
# Mini GPT-2 config  |  ~10M parameters  (default dashboard config)
# Trains in ~20 minutes on a modern GPU. This is the primary demo config.
# ─────────────────────────────────────────────────────────────────────────────
#
# Parameter breakdown:
#   Token embedding    : 2048 × 384  =  786,432
#   Position embedding : 256  × 384  =   98,304
#   Per block          : ~885,000     × 6 layers = ~5.3M
#   LM head (tied)     :           0  (shared with wte)
#   Total              : ~10.2M params
# ─────────────────────────────────────────────────────────────────────────────

# Model Architecture
vocab_size: 2048
block_size: 256
n_layer: 6
n_head: 6
n_embd: 384
dropout: 0.1
norm_type: layernorm        # 'layernorm' | 'rmsnorm'
pos_emb_type: absolute      # 'absolute' | 'rope'
mlp_type: gelu              # 'gelu' | 'swiglu'
n_kv_head: null             # null = standard MHA; integer = GQA

# Training Hyperparameters
batch_size: 64
learning_rate: 3.0e-4
max_iters: 5000
weight_decay: 0.1
beta1: 0.9
beta2: 0.95
grad_clip: 1.0

# LR Schedule
warmup_iters: 200
min_lr: 3.0e-5

# Evaluation
eval_interval: 100
eval_iters: 40
